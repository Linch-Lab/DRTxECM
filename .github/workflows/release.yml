name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # 版本固定 3.10：上游 requirements.txt 鎖定的 scipy 1.10 / numpy 1.24 /
      # pandas 1.5 沒有 3.12+ 的 wheel，INSTALL.md 也建議用 3.10。
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content version.txt -Raw).Trim()
          if (-not $v) { throw "version.txt is empty" }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Building DRTxECM v$v"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/requirements-build.txt

      - name: Generate Windows version resource
        run: python packaging/make_version_info.py

      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean DRTxECM.spec

      - name: Check the bundle was produced
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/DRTxECM/DRTxECM.exe")) {
            throw "DRTxECM.exe was not built"
          }
          $mb = (Get-ChildItem dist/DRTxECM -Recurse -File |
                 Measure-Object Length -Sum).Sum / 1MB
          Write-Host ("bundle size: {0:N1} MB" -f $mb)

      # 這是本流程最重要的一道關卡。PyInstaller 常常「建置成功」卻在啟動時
      # 才因為缺少 Qt 平台外掛或 cvxopt 的 BLAS/LAPACK DLL 而崩潰。這裡用
      # offscreen 平台外掛實際跑一次，確認它不會立刻退出，避免把壞掉的
      # 打包檔發佈出去。
      - name: Smoke test (offscreen launch)
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath "dist/DRTxECM/DRTxECM.exe" -PassThru
          Start-Sleep -Seconds 30
          if ($p.HasExited) {
            throw "DRTxECM.exe exited early (code $($p.ExitCode)); the bundle is incomplete"
          }
          Write-Host "OK: the GUI stayed alive for 30 s"
          Stop-Process -Id $p.Id -Force

      # DRTxECM.exe is unsigned, so users on managed (school/company) machines
      # can hit AppLocker/WDAC or antivirus blocks. These two files ship inside
      # the ZIP so a blocked user has something to act on and something to
      # report back. Must run BEFORE the zip step.
      - name: Bundle the user-facing help files
        shell: pwsh
        run: |
          Copy-Item "packaging/extras/*" "dist/DRTxECM/" -Force
          Write-Host "files at the top level of the bundle:"
          Get-ChildItem "dist/DRTxECM" -Force |
            Select-Object Mode, Name, Length | Format-Table -AutoSize

      - name: Zip release
        shell: pwsh
        run: >
          Compress-Archive -Path "dist/DRTxECM/*"
          -DestinationPath "dist/DRTxECM-win64.zip" -Force

      # Second edition: run from source, for users who already have Python.
      # It is ~2.6 MB instead of ~126 MB, and because python.exe is signed
      # while our exe is not, it often works on machines whose policy blocks
      # unsigned executables. Contains the launcher, DEBUG.bat and a Chinese
      # read-me; no build products.
      - name: Build the source (Python) edition
        shell: pwsh
        run: |
          $stage = "dist/DRTxECM-python"
          New-Item -ItemType Directory -Force $stage | Out-Null
          # NOTE: the package folder is 'pyDRTtools' (capital T). Copy-Item on
          # Windows is case-insensitive, so a typo here silently creates the
          # destination with the WRONG casing - and CPython's import path cache
          # is case-sensitive, so `import pyDRTtools` then fails. The verify
          # step below exists to catch exactly that.
          $items = @("launch.py", "requirements.txt", "INSTALL.md", "LICENSE",
                     "README.md", "pyDRTtools", "EIS data", "manual", "tutorial")
          foreach ($i in $items) {
            if (-not (Test-Path -LiteralPath $i)) { throw "missing $i for the source edition" }
            Copy-Item -LiteralPath $i -Destination $stage -Recurse -Force
          }
          Copy-Item "packaging/python-edition/*" $stage -Force
          Get-ChildItem $stage -Recurse -Directory -Filter "__pycache__" |
            Remove-Item -Recurse -Force
          $f = Get-ChildItem $stage -Recurse -File -Force
          Write-Host ("source edition: {0} files, {1:N2} MB" -f $f.Count,
                      (($f | Measure-Object Length -Sum).Sum / 1MB))
          Get-ChildItem $stage -Force | Select-Object Name | Format-Table -AutoSize

      # Do not zip or publish a source edition that cannot actually be imported.
      - name: Verify the source edition
        shell: pwsh
        run: |
          $stage = "dist/DRTxECM-python"
          if (-not (Test-Path -LiteralPath "$stage/pyDRTtools/__init__.py")) {
            throw "pyDRTtools/__init__.py is missing or has the wrong casing"
          }
          foreach ($f in @("START-HERE.bat", "DEBUG.bat", "READ-ME-FIRST.txt",
                           "launch.py", "requirements.txt")) {
            if (-not (Test-Path -LiteralPath "$stage/$f")) {
              throw "missing $f in the source edition"
            }
          }
          # no non-ASCII bytes in the launchers, no bare LF line endings
          foreach ($b in @("$stage/START-HERE.bat", "$stage/DEBUG.bat")) {
            $bytes = [IO.File]::ReadAllBytes($b)
            if (($bytes | Where-Object { $_ -gt 127 }).Count -ne 0) {
              throw "$b contains non-ASCII bytes; cmd.exe will misparse it"
            }
            if (($bytes | Where-Object { $_ -eq 10 }).Count -ne
                ([regex]::Matches([Text.Encoding]::Latin1.GetString($bytes), "`r`n").Count)) {
              throw "$b has bare LF line endings; cmd.exe will misparse it"
            }
          }
          Push-Location $stage
          python -c "import pyDRTtools; print('OK: the staged source edition imports cleanly')"
          Pop-Location
          Compress-Archive -Path "$stage/*" `
            -DestinationPath "dist/DRTxECM-python.zip" -Force

      - name: Generate SHA256
        shell: pwsh
        run: |
          # 必須在壓縮之後執行，且雜湊對象是「zip 檔」本身，這樣才能對應
          # 網站上 certutil -hashfile DRTxECM-win64.zip SHA256 的驗證方式。
          $lines = @()
          foreach ($z in @("DRTxECM-win64.zip", "DRTxECM-python.zip")) {
            $h = (Get-FileHash "dist/$z" -Algorithm SHA256).Hash
            $lines += "$h  $z"
          }
          $lines | Out-File -Encoding utf8 "dist/SHA256SUMS.txt"
          Get-Content "dist/SHA256SUMS.txt"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: DRTxECM v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            dist/DRTxECM-win64.zip
            dist/DRTxECM-python.zip
            dist/SHA256SUMS.txt
